<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#231d2f">
  <title>OBD Universe | V1 / V2 / V3 viewer</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#f7f2f7;background:#231d2f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:flex;flex-direction:column}
    button,a{font:inherit}
    button:focus-visible,a:focus-visible{outline:3px solid #b5eff0;outline-offset:3px}
    .bar{display:flex;align-items:center;gap:22px;padding:12px clamp(15px,2.5vw,36px);min-height:76px;background:#231d2f;border-bottom:1px solid #ffffff24;z-index:2}
    .identity{display:flex;align-items:center;gap:13px;min-width:194px}
    .mark{font-size:28px;font-weight:900;letter-spacing:-2px;line-height:1}
    .identity small{display:block;color:#bdb4c9;font-size:10px;line-height:1.35;letter-spacing:.08em;text-transform:uppercase}
    .tabs{display:flex;gap:3px;padding:4px;border:1px solid #ffffff2b;border-radius:999px;background:#ffffff0c}
    .tabs button{border:0;border-radius:999px;padding:11px 23px;background:transparent;color:#cec7d8;min-width:102px;cursor:pointer;font-weight:700;transition:background .18s,color .18s}
    .tabs button[aria-selected="true"]{background:#efe7ef;color:#251d2f;box-shadow:0 2px 12px #0d071042}
    .tabs button:hover:not([aria-selected="true"]){background:#ffffff18;color:white}
    .meta{margin-left:auto;display:flex;align-items:center;gap:13px}
    .version-note{color:#cbc3d3;font-size:12px;white-space:nowrap}
    .open{color:#f8f3f9;text-decoration:none;border:1px solid #ffffff52;padding:10px 13px;border-radius:8px;white-space:nowrap;font-size:12px}
    .open:hover{background:#ffffff1c}
    .copy{background:none;color:#d8d0df;border:0;padding:10px;cursor:pointer;font-size:12px;white-space:nowrap}
    .copy:hover{color:white}
    .preview{flex:1;min-height:0;position:relative;background:#eee8f4}
    iframe{display:block;width:100%;height:100%;min-height:calc(100dvh - 76px);border:0;background:#eee8f4}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1100px){.version-note,.copy{display:none}}
    @media(max-width:760px){.bar{flex-wrap:wrap;gap:10px 14px;min-height:0}.identity{min-width:0;flex:1}.mark{font-size:24px}.identity small{font-size:8px}.tabs{order:3;width:100%}.tabs button{flex:1;min-width:0;padding-inline:8px}.meta{margin-left:0}iframe{min-height:calc(100dvh - 110px)}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="identity"><strong class="mark">OBD</strong><small>Universe<br>design archive</small></div>
    <div class="tabs" role="tablist" aria-label="Landing page version">
      <button id="v1-tab" type="button" role="tab" aria-controls="preview-panel" aria-selected="false" tabindex="-1" data-version="v1">V1</button>
      <button id="v2-tab" type="button" role="tab" aria-controls="preview-panel" aria-selected="false" tabindex="-1" data-version="v2">V2</button>
      <button id="v3-tab" type="button" role="tab" aria-controls="preview-panel" aria-selected="true" tabindex="0" data-version="v3">V3</button>
    </div>
    <div class="meta"><span class="version-note" id="version-note">Depth-scene draft · form preview only</span><a id="open-page" class="open" href="./versions/v3/index.html?rev=cloud-pocket1" target="_blank" rel="noopener">Open full page ↗</a><button id="copy-link" class="copy" type="button">Copy view link</button></div>
  </header>
  <main class="preview" id="preview-panel" role="tabpanel" aria-labelledby="v3-tab"><iframe id="preview-frame" src="./versions/v3/index.html?rev=cloud-pocket1" title="OBD Universe V3 landing page" allow="autoplay; fullscreen"></iframe></main>
  <p class="sr-only" id="view-status" role="status" aria-live="polite"></p>
  <script>
    const versions={v1:{label:'Original offer draft · preview only',title:'OBD Universe V1 landing page'},v2:{label:'Pastel-cloud draft · preview only',title:'OBD Universe V2 landing page'},v3:{label:'Depth-scene draft · form preview only',title:'OBD Universe V3 landing page'}};
    const tabs=[...document.querySelectorAll('[data-version]')];
    const frame=document.querySelector('#preview-frame');
    const panel=document.querySelector('#preview-panel');
    const note=document.querySelector('#version-note');
    const open=document.querySelector('#open-page');
    const status=document.querySelector('#view-status');
    function show(version,updateUrl=true){
      const v=versions[version]?version:'v3';
      const src=`./versions/${v}/index.html${v==='v2'?'?rev=pastel1':v==='v3'?'?rev=cloud-pocket1':''}`;
      tabs.forEach(tab=>{const active=tab.dataset.version===v;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1});
      panel.setAttribute('aria-labelledby',`${v}-tab`);
      note.textContent=versions[v].label;
      frame.title=versions[v].title;
      if(frame.getAttribute('src')!==src)frame.src=src;
      open.href=src;
      if(updateUrl){const url=new URL(location.href);url.searchParams.set('v',v);history.replaceState(null,'',url)}
      status.textContent=`Showing ${v.toUpperCase()}`;
    }
    tabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>show(tab.dataset.version));
      tab.addEventListener('keydown',event=>{if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;event.preventDefault();const next=tabs[(index+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length];next.focus();show(next.dataset.version)});
    });
    document.querySelector('#copy-link').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);status.textContent='View link copied'}catch{status.textContent='Copy the address from the browser to share this view'}});
    addEventListener('popstate',()=>show(new URL(location.href).searchParams.get('v'),false));
    show(new URL(location.href).searchParams.get('v'),false);
  </script>
</body>
</html>
